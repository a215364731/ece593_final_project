// ============================================================================
// cm_hier.cfg - Coverage scope for AXI4-Lite UVM TB (VCS R-2020.12 syntax)
//
// VCS R-2020.12 coverage hierarchy syntax:
//   +tree <instance_path> [<depth>]   Include instance subtree
//   -tree <instance_path> [<depth>]   Exclude instance subtree
//   +module <module_name>             Include all instances of module
//   -module <module_name>             Exclude all instances of module
//
// Note: directive and argument are SPACE-separated (not + or =).
//
// We include the DUT subtree only. This single line picks up s_axil_top
// plus its s_axil_wr and s_axil_rd children automatically, and excludes
// everything in the TB / UVM library.
// ============================================================================

+tree axil_tb_top.dut
